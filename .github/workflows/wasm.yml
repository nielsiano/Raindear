name: wasm

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: swift:6.4.0
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y make
      - name: Install the Swift SDK for WebAssembly
        run: |
          swift sdk install \
            https://download.swift.org/swift-6.4.0-release/wasm-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_wasm.artifactbundle.tar.gz \
            --checksum f07b7be3c586d92d7a07051fc6d303b87ebea67eadc40640ba59d5a8b79aa86d
      - run: make wasm
      - uses: actions/upload-artifact@v4
        with:
          name: rain-wasm
          path: |
            web/rain.wasm
            web/rain-worklet.js
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            web/rain.wasm
            web/rain-worklet.js
